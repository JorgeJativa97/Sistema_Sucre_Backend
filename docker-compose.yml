version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network

  backend:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --timeout 600 --workers 3 Cabildoapp.wsgi:application
    ports:
      - "8000:8000"
    env_file:
      - .env  # ← ESTO CARGA LAS VARIABLES DEL .env
    volumes:
      - media_volume:/app/media
    depends_on:
      - redis
    networks:
      - backend-network

  celery_worker:
    build: .
    command: celery -A Cabildoapp worker --loglevel=info --concurrency=2
    env_file:
      - .env  # ← ESTO TAMBIÉN
    volumes:
      - media_volume:/app/media
    depends_on:
      - redis
      - backend
    networks:
      - backend-network
    user: "1000:1000"  # ← AGREGAR ESTA LÍNEA (mismo usuario que en Dockerfile)

networks:
  backend-network:
    driver: bridge

volumes:
  media_volume: