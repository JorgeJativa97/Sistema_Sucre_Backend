version: '3.8'

services:
  redis:
    image: redis:7-alpine
    # Sin ports: Redis solo es accesible dentro de backend-network
    networks:
      - backend-network
    restart: unless-stopped

  backend:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --timeout 600 --workers 3 Cabildoapp.wsgi:application
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    depends_on:
      - redis
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      # Verifica que gunicorn responda en el puerto 8000 (cualquier respuesta HTTP es válida)
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery_worker:
    build: .
    command: celery -A Cabildoapp worker --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    depends_on:
      - redis
      - backend
    networks:
      - backend-network
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A Cabildoapp inspect ping --timeout=5 > /dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  flower:
    build: .
    command: celery -A Cabildoapp flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - backend-network
    restart: unless-stopped
    env_file:
      - .env

networks:
  backend-network:
    driver: bridge

volumes:
  media_volume:
