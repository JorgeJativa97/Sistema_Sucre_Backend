version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network

  backend:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --timeout 600 --workers 3 Cabildoapp.wsgi:application
    ports:
      - "8000:8000"
    env_file:
      - .env  # ← ESTO CARGA LAS VARIABLES DEL .env
    volumes:
      - media_volume:/app/media
    depends_on:
      - redis
    networks:
      - backend-network

  celery_worker:
    build: .
    command: celery -A Cabildoapp worker --loglevel=info --concurrency=2
    env_file:
      - .env  # ← ESTO TAMBIÉN
    volumes:
      - media_volume:/app/media
    depends_on:
      - redis
      - backend
    networks:
      - backend-network
    user: "1000:1000"  # ← AGREGAR ESTA LÍNEA (mismo usuario que en Dockerfile)

  flower:
    build: .
    command: celery -A Cabildoapp flower --port=5555 --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=admin:ClaveSecreta123  # Usuario y contraseña
    networks:
      - backend-network
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge

volumes:
  media_volume: