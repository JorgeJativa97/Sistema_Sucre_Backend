version: '3.8'

services:
  redis:
    image: redis:7-alpine
    # Sin ports: Redis solo es accesible dentro de backend-network
    networks:
      - backend-network

  backend:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --timeout 600 --workers 3 Cabildoapp.wsgi:application
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    depends_on:
      - redis
    networks:
      - backend-network

  celery_worker:
    build: .
    command: celery -A Cabildoapp worker --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    depends_on:
      - redis
      - backend
    networks:
      - backend-network
    user: "1000:1000"

  flower:
    build: .
    command: celery -A Cabildoapp flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - backend-network
    restart: unless-stopped
    env_file:
      - .env

networks:
  backend-network:
    driver: bridge

volumes:
  media_volume:
